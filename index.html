<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonely Obfuscator v1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a12;--surface:#111120;--surface2:#181830;--border:#2a2a4a;
--accent:#7c5cfc;--accent2:#a78bfa;--text:#e2e8f0;--muted:#64748b;
--green:#22c55e;--red:#ef4444;--yellow:#eab308;
--font:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px}
.logo-text h1{font-size:1.25rem;font-weight:700;color:var(--accent2)}
.logo-text p{font-size:.75rem;color:var(--muted)}
.badge{margin-left:auto;background:linear-gradient(135deg,#7c5cfc,#a78bfa);color:#fff;padding:4px 12px;border-radius:999px;font-size:.7rem;font-weight:600}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:0;padding:0}
.toolbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.options-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:.15s;padding:5px 10px;border-radius:6px;border:1px solid transparent}
.opt-label:hover{color:var(--text);background:var(--surface2);border-color:var(--border)}
.opt-label input[type=checkbox]{display:none}
.opt-label .check{width:16px;height:16px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.opt-label input:checked~.check{background:var(--accent);border-color:var(--accent)}
.opt-label input:checked~.check svg{display:block}
.opt-label .check svg{display:none;width:10px;height:10px}
.opt-label input:checked{color:var(--text)}
.opt-label:has(input:checked){color:var(--text)}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.btn-obf{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:9px 24px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;flex-shrink:0}
.btn-obf:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-obf:disabled{opacity:.5;cursor:not-allowed;transform:none}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.panel:last-child{border-right:none}
.panel-header{background:var(--surface2);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.panel-title{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.panel-actions{display:flex;gap:8px}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;gap:6px;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--accent)}
textarea{flex:1;background:var(--surface);color:var(--text);border:none;resize:none;padding:20px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.85rem;line-height:1.6;outline:none;width:100%}
textarea::placeholder{color:var(--muted)}
.status-bar{grid-column:1/-1;background:var(--surface);border-top:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:16px;font-size:.78rem;color:var(--muted)}
.status-indicator{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.green{background:var(--green)}
.dot.red{background:var(--red)}
.dot.yellow{background:var(--yellow);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.stat{display:flex;align-items:center;gap:5px}
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:.85rem;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.4);transition:opacity .3s,transform .3s;z-index:999}
.toast.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}
@media(max-width:768px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr 1fr}
.toolbar{padding:10px 16px}.btn-obf{padding:8px 16px;font-size:.82rem}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="url(#lg1)"/>
      <path d="M12 28V14l6 7 6-7v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="14" r="3" fill="#a78bfa"/>
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#7c5cfc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
    </svg>
    <div class="logo-text">
      <h1>Lonely Obfuscator</h1>
      <p>lonelyhub.wibu.life &mdash; Lua 5.1 VM Obfuscation</p>
    </div>
  </div>
  <span class="badge">v1.0</span>
</header>

<main>
  <div class="toolbar">
    <div class="options-group">
      <label class="opt-label">
        <input type="checkbox" id="opt-cf" checked>
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><path d="M3 9l4-4 4 4M7 5v14M21 15l-4 4-4-4M17 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Control Flow
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-mut" checked>
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Mutate Opcodes
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-so" checked>
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><path d="M17.5 14v7M14 17.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Super Ops
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-comp" checked>
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Compress
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-min" checked>
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><path d="M4 6h16M4 12h16M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Minify
      </label>
      <div class="sep"></div>
      <label class="opt-label">
        <input type="checkbox" id="opt-enc">
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Encrypt Strings
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-enckey">
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Encrypt Keywords
      </label>
      <label class="opt-label">
        <input type="checkbox" id="opt-li">
        <div class="check"><svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left:4px"><path d="M9 12h6M9 16h6M7 8h.01M17 8h.01M3 6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Preserve Lines
      </label>
    </div>
    <button class="btn-obf" id="btn-obf" onclick="doObfuscate()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" id="btn-icon"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Obfuscate
    </button>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Input &mdash; Lua Source
      </div>
      <div class="panel-actions">
        <button class="icon-btn" onclick="clearInput()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Clear
        </button>
        <button class="icon-btn" onclick="loadExample()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Example
        </button>
      </div>
    </div>
    <textarea id="input-code" placeholder="-- Paste your Lua 5.1 code here...
-- Example:
-- print('Hello, World!')
-- local x = 42
-- for i = 1, 10 do print(i) end"></textarea>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Output &mdash; Obfuscated
      </div>
      <div class="panel-actions">
        <button class="icon-btn" onclick="copyOutput()" id="btn-copy">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Copy
        </button>
        <button class="icon-btn" onclick="downloadOutput()" id="btn-dl">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download
        </button>
      </div>
    </div>
    <textarea id="output-code" placeholder="-- Obfuscated output will appear here..." readonly></textarea>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
    <div class="sep" style="height:16px;background:var(--border);width:1px"></div>
    <div class="stat" id="stat-in" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.8"/></svg>
      <span id="stat-in-val"></span>
    </div>
    <div class="stat" id="stat-out" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" stroke="currentColor" stroke-width="1.8"/></svg>
      <span id="stat-out-val"></span>
    </div>
    <div class="stat" id="stat-time" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="stat-time-val"></span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Lonely Obfuscator v1.0 &mdash; lonelyhub.wibu.life
    </div>
  </div>
</main>

<div class="toast hidden" id="toast"></div>

<script>
const EXAMPLE = `local function fib(n)\n  if n <= 1 then return n end\n  return fib(n-1) + fib(n-2)\nend\n\nfor i = 0, 10 do\n  print("fib(" .. i .. ") = " .. fib(i))\nend\n\nlocal t = {}\nfor i = 1, 5 do t[i] = i * i end\nprint(table.concat(t, ", "))`;

function setStatus(state, msg) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'dot ' + (state || '');
  txt.textContent = msg;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + (type || '');
  t.innerHTML = (type === 'ok'
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#ef4444" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>'
  ) + msg;
  setTimeout(() => { t.className = 'toast hidden'; }, 3500);
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}

async function doObfuscate() {
  const code = document.getElementById('input-code').value.trim();
  if (!code) { showToast('Please enter some Lua code first.', 'err'); return; }

  const btn = document.getElementById('btn-obf');
  const icon = document.getElementById('btn-icon');
  btn.disabled = true;
  icon.innerHTML = '<animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/><path d="M12 2a10 10 0 0110 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>';
  setStatus('yellow', 'Obfuscating...');
  document.getElementById('stat-in').style.display = 'none';
  document.getElementById('stat-out').style.display = 'none';
  document.getElementById('stat-time').style.display = 'none';

  const opts = {
    controlFlow: document.getElementById('opt-cf').checked,
    mutate: document.getElementById('opt-mut').checked,
    superOperators: document.getElementById('opt-so').checked,
    bytecodeCompress: document.getElementById('opt-comp').checked,
    minify: document.getElementById('opt-min').checked,
    encryptStrings: document.getElementById('opt-enc').checked,
    encryptImportantStrings: document.getElementById('opt-enckey').checked,
    preserveLineInfo: document.getElementById('opt-li').checked,
  };

  const t0 = Date.now();
  try {
    const resp = await fetch('/obfuscate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, options: opts })
    });
    const data = await resp.json();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

    if (data.success) {
      document.getElementById('output-code').value = data.result;
      setStatus('green', 'Done');
      document.getElementById('stat-in').style.display = 'flex';
      document.getElementById('stat-in-val').textContent = 'Input: ' + fmtSize(new Blob([code]).size);
      document.getElementById('stat-out').style.display = 'flex';
      document.getElementById('stat-out-val').textContent = 'Output: ' + fmtSize(new Blob([data.result]).size);
      document.getElementById('stat-time').style.display = 'flex';
      document.getElementById('stat-time-val').textContent = elapsed + 's';
      showToast('Obfuscation complete in ' + elapsed + 's', 'ok');
    } else {
      document.getElementById('output-code').value = '-- Error:\n-- ' + data.error;
      setStatus('red', 'Error');
      showToast(data.error.substring(0, 100), 'err');
    }
  } catch (e) {
    setStatus('red', 'Network error');
    showToast('Cannot reach server: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    icon.innerHTML = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';
  }
}

function clearInput() {
  document.getElementById('input-code').value = '';
  document.getElementById('output-code').value = '';
  setStatus('', 'Ready');
  document.getElementById('stat-in').style.display = 'none';
  document.getElementById('stat-out').style.display = 'none';
  document.getElementById('stat-time').style.display = 'none';
}

function loadExample() {
  document.getElementById('input-code').value = EXAMPLE;
  showToast('Example loaded', 'ok');
}

async function copyOutput() {
  const v = document.getElementById('output-code').value;
  if (!v) return;
  try {
    await navigator.clipboard.writeText(v);
    showToast('Copied to clipboard', 'ok');
  } catch { showToast('Copy failed', 'err'); }
}

function downloadOutput() {
  const v = document.getElementById('output-code').value;
  if (!v) return;
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(v);
  a.download = 'obfuscated.lua';
  a.click();
  showToast('Downloaded obfuscated.lua', 'ok');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doObfuscate(); }
});
</script>
</body>
</html>
